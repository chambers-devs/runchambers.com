<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap"><link rel="icon" href="assets/images/logo.png">
<title>Contact Chambers | Book a Demo</title><meta name="description" content="Tell us about your legal practice and book a demo of Chambers."><link rel="stylesheet" href="assets/css/style.css?v=2"><style>#contact-form input:not([type="checkbox"]),#contact-form textarea{background:#FFFFFF;border-color:#391E0333!important;transition:border-color .2s,box-shadow .2s}#contact-form input:not([type="checkbox"]):focus,#contact-form textarea:focus{outline:none;border-color:#391E0366!important;box-shadow:0 0 0 3px #391E0314}#contact-form input::placeholder,#contact-form textarea::placeholder{color:#A3A3A3;opacity:1}</style>
</head>
<body><div class="min-h-screen" style="background:#FBFBFA;color:#391E03;font-family:var(--font-sans)">
<header id="site-header" class="fixed inset-x-0 top-0 z-50 transition-all duration-300"><div class="mx-auto flex h-16 max-w-[1280px] items-center justify-between px-8"><a class="flex items-center gap-2.5" href="index.html" style="color:#391E03"><img src="assets/images/logo.png" alt="Chambers" width="26" height="26"><span class="text-[20px]" style="font-family:var(--font-serif)">Chambers</span></a><nav class="hidden md:flex items-center gap-9 text-[16px]" style="color:#391E03cc"><a href="index.html#product">Products</a><a href="about.html">About</a><a href="faqs.html">Resources</a><a href="pricing.html">Pricing</a><a href="contact.html" aria-current="page">Contact Us</a></nav><a href="https://stage.runchambers.com" class="hidden sm:inline-flex px-3 py-2 text-[13.5px]" style="color:#391E03">Login</a></div></header>
<main class="pt-24 pb-24"><div class="mx-auto max-w-[1280px] px-8"><div class="grid gap-12 md:grid-cols-[0.8fr_1.2fr] md:items-start"><div><div class="text-[11.5px] uppercase tracking-[0.22em]" style="color:#391E0388">Contact Us</div><p class="mt-7 max-w-[38ch] text-[16px] leading-[1.6]" style="color:#391E03b0">Tell us a little about your practice. We’ll get in touch to understand what your firm needs and show you how Chambers can help.</p></div>
<form id="contact-form" class="rounded-[12px] border p-7 md:p-9" style="background:#FCFAF5;border-color:#391E031f" novalidate><div class="grid gap-5 md:grid-cols-2"><label class="text-[13px]">Full Name *<input required maxlength="50" name="fullName" autocomplete="name" placeholder="Enter your full name" class="mt-2 w-full rounded-[6px] border bg-transparent px-3 py-3" style="border-color:#391E0333" type="text"><span class="field-error block text-[12px]" style="color:#9b3d2e"></span></label><label class="text-[13px]">Email *<input required name="email" autocomplete="email" placeholder="name@firm.com" class="mt-2 w-full rounded-[6px] border bg-transparent px-3 py-3" style="border-color:#391E0333" type="email"><span class="field-error block text-[12px]" style="color:#9b3d2e"></span></label><label class="text-[13px]">Mobile Number *<input required name="mobile" inputmode="numeric" placeholder="Enter 10-digit mobile number" maxlength="10" pattern="[0-9]{10}" autocomplete="tel" class="mt-2 w-full rounded-[6px] border bg-transparent px-3 py-3" style="border-color:#391E0333" type="tel"><span class="field-error block text-[12px]" style="color:#9b3d2e"></span></label><label class="text-[13px]">Company Name *<input required maxlength="50" name="firmName" autocomplete="organization" placeholder="Enter your company’s name" class="mt-2 w-full rounded-[6px] border bg-transparent px-3 py-3" style="border-color:#391E0333" type="text"><span class="field-error block text-[12px]" style="color:#9b3d2e"></span></label><label class="text-[13px] md:col-span-2">Firm Size <span style="color:#391E0388">(optional)</span><input name="firmSize" placeholder="e.g. 1–10 advocates" class="mt-2 w-full rounded-[6px] border bg-transparent px-3 py-3" style="border-color:#391E0333" type="text"></label><label class="text-[13px] md:col-span-2">Query <span style="color:#391E0388">(optional)</span><textarea name="query" maxlength="500" placeholder="Tell us what you’d like to discuss" rows="5" class="mt-2 w-full resize-y rounded-[6px] border bg-transparent px-3 py-3" style="border-color:#391E0333"></textarea><span id="query-count" class="block text-right text-[12px]" style="color:#391E0388">0/500</span></label></div><label class="mt-6 flex items-start gap-3 text-[13px] leading-[1.5]"><input required id="consent" name="consent" type="checkbox" class="mt-1 h-4 w-4 accent-[#391E03]"><span>I agree to the <a href="tos.html" class="underline underline-offset-4">Terms and Conditions</a> and <a href="privacy.html" class="underline underline-offset-4">Privacy Policy</a>*</span></label><span id="consent-error" class="mt-1 block text-[12px]" style="color:#9b3d2e"></span><button type="submit" class="mt-7 inline-flex w-full justify-center rounded-full px-5 py-3 text-[14px] font-medium" style="background:#391E03;color:#FBFBFA">Submit details →</button><p id="form-status" class="mt-4 text-center text-[13px]" role="status"></p></form></div></div></main>
<footer class="pt-12 pb-12" style="background:#FBFBFA;border-top:1px solid #391E031f"><div class="mx-auto max-w-[1280px] px-8 text-[12.5px]" style="color:#391E0388"><span>© 2026 Kalpavriksha Partners LLP</span></div></footer></div>
<script>(function(){var h=document.getElementById('site-header');function u(){h.classList.toggle('is-scrolled',scrollY>8)}u();addEventListener('scroll',u,{passive:true});var f=document.getElementById('contact-form'),q=f.querySelector('[name=query]');q.addEventListener('input',function(){document.getElementById('query-count').textContent=q.value.length+'/500'});f.addEventListener('submit',function(e){e.preventDefault();var ok=true;var consent=document.getElementById('consent'),ce=document.getElementById('consent-error');ce.textContent=consent.checked?'':'You must agree before submitting.';if(!consent.checked)ok=false;f.querySelectorAll('input[required]:not(#consent)').forEach(function(i){var m=i.validity.valueMissing?'This field is required.':i.name==='mobile'&&!/^\d{10}$/.test(i.value)?'Enter exactly 10 digits.':i.validity.typeMismatch?'Enter a valid email address.':i.validity.tooLong?'Keep this within 50 characters.':'';i.nextElementSibling.textContent=m;if(m)ok=false});if(!ok)return;var d=new FormData(f),b='Full Name: '+d.get('fullName')+'\nEmail: '+d.get('email')+'\nMobile Number: '+d.get('mobile')+'\nCompany Name: '+d.get('firmName')+'\nFirm Size: '+d.get('firmSize')+'\nQuery: '+d.get('query');location.href='mailto:vishesh@runchambers.com?subject='+encodeURIComponent('Contact request from '+d.get('fullName'))+'&body='+encodeURIComponent(b)})})();</script>
</body></html>
